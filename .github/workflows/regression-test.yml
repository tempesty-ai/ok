name: Regression Test Pipeline

on:
  # PR 생성/업데이트 시 자동 실행
  pull_request:
    branches: [ main ]

  # main 브랜치 push 시 자동 실행
  push:
    branches: [ main ]

  # 수동 실행 (Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  playwright-regression:
    name: Playwright 회귀 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install -r playwright/requirements.txt
          playwright install chromium

      - name: 🧪 Playwright 회귀 테스트 실행
        run: |
          cd playwright
          pytest tests/ -v --tb=short \
            --html=report.html --self-contained-html \
            -n auto || true

      - name: 📁 테스트 리포트 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright/report.html
          retention-days: 30

  selenium-smoke:
    name: Selenium 스모크 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: pip install -r selenium/requirements.txt

      - name: 🌐 Chrome 설치 확인
        run: |
          google-chrome --version || \
          (apt-get update && apt-get install -y google-chrome-stable)

      - name: 🔥 Selenium 스모크 테스트 실행
        run: |
          cd selenium
          python test_demo.py || true

      - name: 📋 결과 요약
        if: always()
        run: echo "✅ Selenium 스모크 테스트 완료"
